description: |
  WCH CH32H41x Reset and Clock Control (RCC).

  This binding extends the common WCH RCC controller with the bus and ADC
  clock prescalers available on the CH32H41x series. See
  wch,rcc.yaml for the common clock controller properties.

compatible: "wch,ch32h41x-rcc"

include:
  - name: wch,rcc.yaml

properties:
  hb-prescaler:
    type: int
    default: 1
    description: |
      HB bus clock (HCLK) prescaler. The CORE1 (v5f) clock is the system clock
      (SYSCLK) divided by this. The default matches the RCC reset value, which
      leaves SYSCLK undivided.
    enum:
      - 1
      - 2
      - 4
      - 8
      - 16
      - 64
      - 128
      - 256
      - 512

  f-prescaler:
    type: int
    default: 4
    description: |
      HB bus clock (HCLK) prescaler. HCLK is the system clock (SYSCLK) divided
      by this and HPRE and also feeds CORE0 (v3f).
    enum:
      - 1
      - 2
      - 4

  pb2-prescaler:
    type: int
    default: 1
    description: |
      PB2 bus clock (PCLK2) prescaler. PCLK2 is HCLK divided by this value.
      The default matches the RCC reset value, which leaves PCLK2 undivided.
    enum:
      - 1
      - 2
      - 4
      - 8
      - 16

  adc-prescaler:
    type: int
    default: 2
    description: |
      ADC clock prescaler. The ADC clock is PCLK2 divided by this value.
      The default matches the RCC reset value, which divides PCLK2 by 2.
    enum:
      - 2
      - 4
      - 6
      - 8
