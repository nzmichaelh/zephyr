description: |
  CH32V208/203RB RCC (Reset and Clock controller).

  See `wch,rcc.yaml` for more

compatible: "wch,ch32v208-rcc"

include:
  - name: wch,rcc.yaml

hsi-prescaler:
  type: int
  default: 1
  description: HSI prescaler before feeding the PLL
  enum:
    - 1
    - 2

hse-prescaler:
  type: int
  default: 4
  description: HSE prescaler before feeding the PLL
  enum:
    - 2
    - 4
    - 8

hb-prescaler:
  type: int
  default: 1
  enum:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 64
    - 256
    - 512

pb1-prescaler:
  type: int
  default: 1
  enum:
    - 1
    - 2
    - 4
    - 8
    - 16

pb2-prescaler:
  type: int
  default: 1
  enum:
    - 1
    - 2
    - 4
    - 8
    - 16

adc-prescaler:
  type: int
  default: 2
  enum:
    - 2
    - 4
    - 6
    - 8
