description: |
  WCH CH32 Reset and Clock Control (RCC)

  This node implements the system clock source selection and controls clocks
  for the High Performance Bus (HB) and peripheral busses.

  `wch,rcc` contains all common properties. Each series inherits from this.

compatible: "wch,rcc"

include: [clock-controller.yaml, base.yaml]

properties:
  "#clock-cells":
    const: 1

clock-cells:
  - id
