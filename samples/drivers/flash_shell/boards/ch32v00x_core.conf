# Reduce shell buffer sizes to fit in 8KB SRAM
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=32
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=32
CONFIG_SHELL_STACK_SIZE=768
CONFIG_SHELL_CMD_BUFF_SIZE=64
CONFIG_HEAP_MEM_POOL_SIZE=0

# Disable test commands that require large stack/buffers and double printf
CONFIG_FLASH_SHELL_TEST_COMMANDS=n
CONFIG_FLASH_SHELL_BUFFER_SIZE=0x400

# Reduce other thread stack sizes to fit within 8KB SRAM
CONFIG_MAIN_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512
CONFIG_ISR_STACK_SIZE=1024

# Minimize logging memory usage
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_LOG_MODE_MINIMAL=y
